name: Release

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose build type (debug or release)"
        required: true
        default: "release"

env:
  BUILD: ${{ github.run_number }}
  BRANCH: ${{ github.ref_name }}

jobs:

  Windows:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        BUILD_TYPE: ["debug", "release"]
        DISCORD_INTEGRATION: ["using discord", "not using discord"]

    env:
      dev: ${{ matrix.BUILD_TYPE == 'debug' && '_dev' || '' }}
      cmd: ${{ matrix.BUILD_TYPE == 'release' && '--release-build --strip-binary' || '' }}
      discord: ${{ matrix.DISCORD_INTEGRATION == 'using discord' && '--with-discord' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mingw-w64-i686 gcc-mingw-w64-i686 g++-mingw-w64-i686 yasm python3-pip
          pip3 install meson ninja

      - name: Env setup
        run: |
          echo "Build number ${BUILD}"
          echo "Branch ${BRANCH}"
          mkdir -p ciout

      - name: Configure
        env:
          CC: i686-w64-mingw32-gcc
          CXX: i686-w64-mingw32-g++
          LD: i686-w64-mingw32-ld
          AR: i686-w64-mingw32-ar
          RANLIB: i686-w64-mingw32-ranlib
          AS: i686-w64-mingw32-as
        run: ./configure --cross=i686-w64-mingw32 ${{env.cmd}} ${{env.discord}}

      - name: Build
        run: |
          make clean
          make -j$(nproc)
          mv DerivedData/MinGW-i686/onscripter-ru.exe ciout
          cp -r Resources/Windows/dlls ciout/dlls
          cd ciout
          zip -qry onscripter-ru_win_${BRANCH}_r${BUILD}${{env.dev}}${{env.discord}}.zip onscripter-ru.exe dlls

      - name: Upload files
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: false
          tag: ${{ env.BRANCH }}-r${{ env.BUILD }}
          name: ONScripter-ru ${{ env.BRANCH }} r${{ env.BUILD }}
          body: |
            Automated build

            Branch: ${{ env.BRANCH }}
            Commit: ${{ github.sha }}
          artifacts: "ciout/*.zip"


  Linux:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        BUILD_TYPE: ["debug", "release"]

    env:
      dev: ${{ matrix.BUILD_TYPE == 'debug' && '_dev' || '' }}
      cmd: ${{ matrix.BUILD_TYPE == 'release' && '--release-build --strip-binary' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm libreadline-dev libasound-dev libgl1-mesa-dev libegl1-mesa-dev libxrandr-dev python3-pip
          pip3 install meson ninja

      - name: Env setup
        run: |
          echo "Build number ${BUILD}"
          echo "Branch ${BRANCH}"
          mkdir -p ciout

      - name: Configure
        run: ./configure ${{env.cmd}}

      - name: Build
        run: |
          make clean
          make -j$(nproc)
          mv DerivedData/Posix-x86_64/onscripter-ru ciout
          cd ciout
          zip -qry onscripter-ru_linux64_${BRANCH}_r${BUILD}${{env.dev}}.zip onscripter-ru
          rm onscripter-ru
          cd ..

      - name: Upload files
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: false
          tag: ${{ env.BRANCH }}-r${{ env.BUILD }}
          name: ONScripter-ru ${{ env.BRANCH }} r${{ env.BUILD }}
          body: |
            Automated build

            Branch: ${{ env.BRANCH }}
            Commit: ${{ github.sha }}
          artifacts: "ciout/*.zip"


  macOS:
    runs-on: macos-11

    strategy:
      matrix:
        BUILD_TYPE: ["Debug", "Release"]

    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      dev: ${{ matrix.BUILD_TYPE == 'Debug' && '_dbg' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          brew install yasm meson ninja

      - name: Env setup
        run: |
          echo "Build number ${BUILD}"
          echo "Branch ${BRANCH}"
          mkdir -p ciout

      - name: Build
        run: |
          xcodebuild ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO -target onscripter-ru-osx -configuration ${{ matrix.BUILD_TYPE }}
          mv build/${{ matrix.BUILD_TYPE }}/onscripter-ru-osx.app ciout
          cd ciout
          zip -qry onscripter-ru_osx_${BRANCH}_r${BUILD}${{ env.dev }}.zip onscripter-ru-osx.app
          rm -rf onscripter-ru-osx.app
          cd -

      - name: Upload files
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: false
          tag: ${{ env.BRANCH }}-r${{ env.BUILD }}
          name: ONScripter-ru ${{ env.BRANCH }} r${{ env.BUILD }}
          body: |
            Automated build

            Branch: ${{ env.BRANCH }}
            Commit: ${{ github.sha }}
          artifacts: "ciout/*.zip"
